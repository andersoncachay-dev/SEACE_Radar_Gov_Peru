<head>

<x-dc>
<helmet>
<style>
body{margin:0}
.gr{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#051326;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.gr *{box-sizing:border-box}
.gr svg.ic{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--brand);color:#fff}
.btn-secondary{background:#fff;color:#0a2449;border-color:#7d95b6}
.btn-ghost{background:transparent;color:#0a2449}
.btn-icon{width:44px;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
.s-green{background:#e7f8f1;border-color:#a8e1cc;color:#086448}.s-green i{background:#12a66f}
.s-amber{background:#fff5df;border-color:#f3d28f;color:#7b4a00}.s-amber i{background:#d99016}
.s-pending{background:#f3f6fb;border-color:#c7d4e8;color:#405471}.s-pending i{background:#7184a1}
.s-red{background:#fff0f0;border-color:#ffc7c7;color:#9d1d1d}.s-red i{background:#d33a34}
.card{background:#fff;border:1px solid #d5e1f0;border-radius:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi-label{font-size:13px;font-weight:600;color:#51627b}
.kpi-value{font-size:28px;font-weight:800;letter-spacing:-0.02em;color:#061a35;font-variant-numeric:tabular-nums;line-height:1.15}
.cap{font-size:12px;color:#51627b}
.num{font-variant-numeric:tabular-nums}
.h-page{margin:0;font-size:20px;font-weight:700;letter-spacing:-0.01em}
.input{height:44px;border:1px solid #7d95b6;border-radius:8px;padding:0 12px;background:#fff;font-size:14px;color:#51627b;display:flex;align-items:center;gap:8px}
.rail{background:#061a35;color:#b9c8dd}
.rb{width:52px;height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#b9c8dd;text-decoration:none;font-size:10px;font-weight:500;position:relative}
.rb.on{background:rgba(255,255,255,0.10);color:#fff;font-weight:600}
.rb .dot{position:absolute;top:8px;right:12px;width:8px;height:8px;border-radius:50%;background:#d33a34}
.segl{display:inline-grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:10px;background:#e4ecf6}
.segl a{height:36px;padding:0 16px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:14px;font-weight:600;color:#405471;text-decoration:none}
.segl a.on{background:#fff;color:#061a35;box-shadow:0 1px 2px rgba(6,26,53,0.12)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 16px;border-bottom:1px solid #e4ecf6}
</style>
</helmet>
<div class="gr" style="width: 834px; height: 1112px; display: flex; background: #f3f7fc; overflow: hidden; --brand: {{brand}}; --brand-hover: {{brandHover}}; --brand-soft: {{brandSoft}}; --brand-ink: {{brandInk}};">

    <a class="rb" href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>

    <a class="rb" href="Componentes.dc.html" style="margin-top: auto;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Config.</a>
    <span style="width: 36px; height: 36px; border-radius: 50%; background: #123f86; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 8px;">AC</span>
  </nav>
  <main style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px 24px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <nav class="segl" aria-label="Módulo"><a href="Radar-Tablet.dc.html" class="on">Radar en vivo</a><a href="Historico-Tablet.dc.html">Histórico</a></nav>
      <button class="btn btn-secondary" style="margin-left: auto;"><img src="/_blob/274e8b2cc466fb96cb57489cb57b524f" alt="" style="width: 20px; height: 20px;">Perú<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px;"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;"><h1 class="h-page">Oportunidades</h1><span class="cap">Actualizado hace 4 min · SEACE y OCDS</span></div>
      <button class="btn btn-secondary btn-icon" aria-label="Exportar" style="margin-left: auto;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
      <button class="btn btn-primary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Actualizar</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
        <div class="card kpi"><span class="kpi-label">{{k.label}}</span><span class="kpi-value">{{k.value}}</span><span class="cap">{{k.hint}}</span></div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 8px;">
      <div class="input" style="flex: 1 1 auto;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Buscar entidad o palabra clave</div>
      <button class="btn btn-secondary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></svg>Filtros · 2</button>
    </div>
    <div class="card" style="flex: 1 1 auto; min-height: 0; overflow: hidden;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div class="row">
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
            <span style="display: flex; gap: 8px; align-items: center;"><span class="chip {{r.cls}}"><i></i>{{r.signal}}</span><span class="cap">{{r.source}} · {{r.stage}}</span></span>
            <span style="font-weight: 600; font-size: 15px;">{{r.entity}}</span>
            <span class="cap" style="font-size: 13px;">{{r.desc}}</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right;">
            <span class="num" style="font-weight: 700;">{{r.amount}}</span>
            <span class="num" style="font-size: 13px; font-weight: 600;">{{r.due}}</span>
            <span class="cap">{{r.left}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#185bc1","options":["#185bc1","#0b6e74","#b4461b","#1f2a44"],"section":"Marca del cliente"},"$preview":{"width":834,"height":1112}}'>
class Component extends DCLogic {
  renderVals() {
    const brand = this.props.brand ?? '#185bc1';
    const mix = (hex, t, w) => {
      const n = parseInt(String(hex).replace('#', '').slice(0, 6), 16);
      const ch = [n >> 16, (n >> 8) & 255, n & 255].map(c => Math.round(c + (t - c) * w));
      return '#' + ch.map(c => c.toString(16).padStart(2, '0')).join('');
    };
    return {
      brand, brandHover: mix(brand, 0, 0.18), brandSoft: mix(brand, 255, 0.9), brandInk: mix(brand, 0, 0.35),
      kpis: [
        { label: 'Activas', value: '128', hint: '+9 nuevas hoy' },

      rows: [
        { cls: 's-red', signal: 'Rojo', entity: 'Ministerio de Transportes y Comunicaciones', desc: 'Enlaces de respaldo para estaciones remotas', source: 'SEACE', stage: 'Ofertas', amount: 'S/ 85 300', due: '14/10/2026', left: 'mañana' },

        { cls: 's-green', signal: 'Verde', entity: 'Municipalidad Provincial de Arequipa', desc: 'Servicio de internet satelital para 12 sedes rurales', source: 'SEACE', stage: 'Ofertas', amount: 'S/ 240 500', due: '17/10/2026', left: 'en 4 días' },

      ]
    };
  }
}
</script>
